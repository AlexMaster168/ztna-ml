name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orchestrator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL, incl. partitioning)
        run: pytest -q
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: ztna.settings_test

  gateway-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==8.4.2 ruff==0.13.3
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  log-shipper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/log-shipper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest==8.4.2 ruff==0.13.3
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [orchestrator, gateway-agent, ml, log-shipper, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose build
          docker compose --profile train build ml-train

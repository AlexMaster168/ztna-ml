worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  server_tokens off;

  # One JSON line per request; this is the feed for the ML pipeline.
  log_format ztna_json escape=json
    '{"ts":"$time_iso8601","peer_ip":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,'
    '"request_length":$request_length,"rt":$request_time,'
    '"ua":"$http_user_agent","host":"$host",'
    '"resource":"$ztna_resource","allow":"$ztna_allow"}';

  access_log /var/log/nginx/access.json ztna_json;
  access_log /dev/stdout ztna_json;

  # Resolve lazily so the gateway stays up even when a backend is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Published resources and per-peer access, rendered by gw-agent (see render_policy).
  include /var/lib/ztna/wg/policy.conf;

  # Only reachable through the tunnel.
  server {
    listen __WG_IP__:80;
    charset utf-8;

    location / {
      default_type text/plain;
      if ($ztna_resource = "") {
        return 404 "ZTNA: ресурс не опубліковано\n";
      }
      if ($ztna_allow = "0") {
        return 403 "ZTNA: доступ до ресурсу обмежено політикою (рівень довіри або група)\n";
      }
      proxy_pass $ztna_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }

  server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
  }
}
